<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Quiz Master</h1>

<div id="start-screen">

<p>Test your knowledge with this fun quiz.</p>

<button id="startBtn">Start Quiz</button>

</div>

<div id="quiz-screen" class="hide">

<div class="top">

<div class="timer">
⏰ Time Left:
<span id="time">15</span>s
</div>

<div class="score">
Score:
<span id="score">0</span>
</div>

</div>

<div class="progress">

<div id="progress-bar"></div>

</div>

<h2 id="question"></h2>

<div id="answers"></div>

<button id="nextBtn" class="hide">Next</button>

</div>

<div id="result-screen" class="hide">

<h2>Quiz Completed 🎉</h2>

<h1 id="finalScore"></h1>

<button onclick="restartQuiz()">Restart Quiz</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
